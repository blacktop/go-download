name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        # windows exercises the fallback (no-flock) finalization paths that
        # vet alone cannot verify; macos exercises the flock paths. 1.26 is
        # the declared minimum; 1.27 is what users increasingly build with.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26', '1.27']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: ${{ matrix.go }}

    # cmd/dl requires a published library version; the workspace makes it
    # build against this checkout's library instead.
    - name: Init workspace
      run: go work init . ./cmd/dl

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -v ./...

    - name: Test CLI
      working-directory: cmd/dl
      run: go test -race -v ./...

    - name: Build CLI
      working-directory: cmd/dl
      run: go build -v ./...
